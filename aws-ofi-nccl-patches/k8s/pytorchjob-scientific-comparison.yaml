# Scientific Comparison Test: PR #968 Deadlock Bug
#
# This manifest runs TWO tests to prove the deadlock bug:
#
# Test A (deadlock-with-bug): v1.17.2 WITH bug reintroduced
#   - Expected: DEADLOCK when MR errors occur
#   - Image: deadlock-test:v1.17.2-with-bug
#
# Test B (deadlock-fixed): v1.17.2 with fix intact (control)
#   - Expected: Graceful error handling, NO deadlock
#   - Image: deadlock-test:v1.17.2-fixed
#
# Usage:
#   # Run with-bug test first
#   kubectl apply -f pytorchjob-scientific-comparison.yaml -n kubeflow
#   kubectl logs -f deadlock-with-bug-master-0 -n kubeflow
#
#   # Then change image to v1.17.2-fixed and test control
#   # Or use both manifests below
#
---
apiVersion: v1
kind: Service
metadata:
  name: deadlock-with-bug-headless
  namespace: kubeflow
spec:
  clusterIP: None
  selector:
    app: deadlock-with-bug
  ports:
  - port: 23456
    name: master
---
apiVersion: "kubeflow.org/v1"
kind: PyTorchJob
metadata:
  name: deadlock-with-bug
  namespace: kubeflow
  labels:
    test-type: scientific-validation
    bug-status: reintroduced
spec:
  nprocPerNode: "8"

  runPolicy:
    activeDeadlineSeconds: 1800  # 30 min - should deadlock before this
    ttlSecondsAfterFinished: 7200
    backoffLimit: 0

  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: Never
      template:
        metadata:
          labels:
            app: deadlock-with-bug
        spec:
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          terminationGracePeriodSeconds: 30
          nodeSelector:
            node.kubernetes.io/instance-type: ml.p5.48xlarge
          volumes:
          - name: shm
            emptyDir:
              medium: Memory
              sizeLimit: 64Gi

          containers:
          - name: pytorch
            # TEST GROUP: v1.17.2 with bug reintroduced + fault injection
            image: 058264135704.dkr.ecr.us-east-2.amazonaws.com/deadlock-test:scientific-with-bug
            imagePullPolicy: Always

            command: ["/bin/bash", "-c"]
            args:
            - |
              echo "=============================================="
              echo "SCIENTIFIC TEST: v1.17.2 WITH BUG REINTRODUCED"
              echo "=============================================="
              echo "Expected: DEADLOCK when MR errors occur"
              echo ""
              cat /opt/aws-ofi-nccl-version.txt
              echo ""

              # Set up environment
              export LD_LIBRARY_PATH=/opt/libfabric-fault-inject/lib:/opt/amazon/aws-ofi-nccl/lib:/opt/amazon/efa/lib:$LD_LIBRARY_PATH
              export NCCL_NET="AWS Libfabric"
              export FI_PROVIDER=efa
              export FI_EFA_USE_HUGE_PAGE=0
              export NCCL_DEBUG=WARN
              export NCCL_TIMEOUT=300

              # FAULT INJECTION: Enable controlled MR errors
              export FI_EFA_MR_INJECT_ENABLE=1
              export FI_EFA_MR_INJECT_START=500   # Start after 500 MR registrations
              export FI_EFA_MR_INJECT_RATE=50     # Inject error every 50 calls

              # Get master address
              export MASTER_ADDR=${MY_POD_IP:-$(hostname -i)}
              export MASTER_PORT=29500

              echo "MASTER_ADDR: $MASTER_ADDR"
              echo "Running stress test..."

              torchrun \
                --nnodes=2 \
                --nproc_per_node=8 \
                --node_rank=${GROUP_RANK:-0} \
                --master_addr=$MASTER_ADDR \
                --master_port=$MASTER_PORT \
                /workspace/moe_stress_test.py

            env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: GROUP_RANK
              value: "0"
            - name: ITERATIONS
              value: "10000"  # Long run to trigger natural MR errors
            - name: REPORT_INTERVAL
              value: "100"

            resources:
              limits:
                nvidia.com/gpu: 8
                vpc.amazonaws.com/efa: 32
                hugepages-2Mi: 5120Mi
                memory: 400Gi
              requests:
                nvidia.com/gpu: 8
                vpc.amazonaws.com/efa: 32
                hugepages-2Mi: 5120Mi
                memory: 200Gi
                cpu: 48

            volumeMounts:
            - name: shm
              mountPath: /dev/shm

            securityContext:
              privileged: true
              capabilities:
                add:
                - IPC_LOCK
                - SYS_RESOURCE

    Worker:
      replicas: 1
      restartPolicy: Never
      template:
        metadata:
          labels:
            app: deadlock-with-bug
        spec:
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          terminationGracePeriodSeconds: 30
          nodeSelector:
            node.kubernetes.io/instance-type: ml.p5.48xlarge
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app: deadlock-with-bug
                topologyKey: kubernetes.io/hostname

          volumes:
          - name: shm
            emptyDir:
              medium: Memory
              sizeLimit: 64Gi

          containers:
          - name: pytorch
            image: 058264135704.dkr.ecr.us-east-2.amazonaws.com/deadlock-test:scientific-with-bug
            imagePullPolicy: Always

            command: ["/bin/bash", "-c"]
            args:
            - |
              echo "Worker starting..."
              cat /opt/aws-ofi-nccl-version.txt

              export LD_LIBRARY_PATH=/opt/libfabric-fault-inject/lib:/opt/amazon/aws-ofi-nccl/lib:/opt/amazon/efa/lib:$LD_LIBRARY_PATH
              export NCCL_NET="AWS Libfabric"
              export FI_PROVIDER=efa
              export FI_EFA_USE_HUGE_PAGE=0
              export NCCL_DEBUG=WARN
              export NCCL_TIMEOUT=300

              # FAULT INJECTION: Enable controlled MR errors
              export FI_EFA_MR_INJECT_ENABLE=1
              export FI_EFA_MR_INJECT_START=500
              export FI_EFA_MR_INJECT_RATE=50

              # Worker waits for master address
              sleep 5
              export MASTER_ADDR=${MASTER_ADDR:-deadlock-with-bug-master-0}
              export MASTER_PORT=29500

              torchrun \
                --nnodes=2 \
                --nproc_per_node=8 \
                --node_rank=1 \
                --master_addr=$MASTER_ADDR \
                --master_port=$MASTER_PORT \
                /workspace/moe_stress_test.py

            env:
            - name: GROUP_RANK
              value: "1"
            - name: ITERATIONS
              value: "10000"
            - name: REPORT_INTERVAL
              value: "100"

            resources:
              limits:
                nvidia.com/gpu: 8
                vpc.amazonaws.com/efa: 32
                hugepages-2Mi: 5120Mi
                memory: 400Gi
              requests:
                nvidia.com/gpu: 8
                vpc.amazonaws.com/efa: 32
                hugepages-2Mi: 5120Mi
                memory: 200Gi
                cpu: 48

            volumeMounts:
            - name: shm
              mountPath: /dev/shm

            securityContext:
              privileged: true
              capabilities:
                add:
                - IPC_LOCK
                - SYS_RESOURCE
